<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MVP (최소 기능 제품)</title>
<style>
@font-face{font-family:"Pretendard";src:url("../fonts/PretendardVariable.woff2") format("woff2-variations"),url("../fonts/PretendardVariable.woff2") format("woff2");font-weight:45 920;font-style:normal;font-display:swap}
:root{
  --bg:#f6f7fb; --surface:#fff; --text:#1c2033; --muted:#646a82; --border:#dfe2ee;
  --accent:#4f46e5; --accent-text:#fff; --accent-soft:#eceafd;
  --ok:#0d7c55; --ok-soft:#e1f6ed; --bad:#c62f3d; --bad-soft:#fde8ea; --warn:#9a6700; --warn-soft:#fff3d1;
  --code-bg:#141827; --code-text:#e6e9f5; --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1220; --surface:#181c30; --text:#e8eaf6; --muted:#9aa1bd; --border:#2b3150;
    --accent:#8b86ff; --accent-text:#10122a; --accent-soft:#25274a;
    --ok:#4fd1a1; --ok-soft:#15332a; --bad:#ff7a86; --bad-soft:#3a1c22; --warn:#f2c14e; --warn-soft:#3a3016;
    --code-bg:#0a0d19;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1220; --surface:#181c30; --text:#e8eaf6; --muted:#9aa1bd; --border:#2b3150;
  --accent:#8b86ff; --accent-text:#10122a; --accent-soft:#25274a;
  --ok:#4fd1a1; --ok-soft:#15332a; --bad:#ff7a86; --bad-soft:#3a1c22; --warn:#f2c14e; --warn-soft:#3a3016;
  --code-bg:#0a0d19;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 "Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header.top h1{font-size:1.05rem;margin:0;flex:1 1 auto}
header.top h1 small{color:var(--muted);font-weight:400;margin-left:6px}
nav.toc{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
nav.toc a{white-space:nowrap;text-decoration:none;color:var(--muted);font-size:.85rem;padding:4px 10px;border-radius:99px;border:1px solid var(--border)}
nav.toc a:hover{color:var(--accent);border-color:var(--accent)}
main{max-width:980px;margin:0 auto;padding:20px 16px 80px}
section.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin:0 0 22px;scroll-margin-top:110px}
section.card h2{margin:0 0 4px;font-size:1.25rem}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;color:var(--accent);background:var(--accent-soft);padding:2px 9px;border-radius:99px;margin-bottom:6px}
.lead{color:var(--muted);margin:0 0 14px}
.terms{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.terms span{font-size:.8rem;background:var(--accent-soft);color:var(--accent);padding:2px 9px;border-radius:6px}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:7px 14px;border-radius:9px;transition:transform .12s,background .15s,border-color .15s}
button:hover{border-color:var(--accent)}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
button.sm{padding:3px 10px;font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}}
.box{border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--bg)}
.box h3{margin:0 0 6px;font-size:.95rem}
.good{border-color:var(--ok);background:var(--ok-soft)}
.badbox{border-color:var(--bad);background:var(--bad-soft)}
pre,code,textarea.code{font-family:"Cascadia Code","D2Coding",Consolas,monospace}
pre.code{background:var(--code-bg);color:var(--code-text);padding:12px;border-radius:10px;overflow:auto;margin:0;font-size:.85rem;line-height:1.55;white-space:pre-wrap;word-break:break-word}
textarea.code{width:100%;min-height:130px;background:var(--code-bg);color:var(--code-text);border:1px solid var(--border);border-radius:10px;padding:10px;font-size:.85rem;resize:vertical}
textarea.plain,input[type=text],select{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text)}
iframe.preview{width:100%;height:230px;border:1px solid var(--border);border-radius:10px;background:#fff}
.hint{font-size:.86rem;color:var(--muted)}
.note{border-left:4px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 8px 8px 0;font-size:.92rem;margin-top:12px}
.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.bar{height:14px;border-radius:99px;background:var(--border);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.78rem;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.check{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.check input{margin-top:6px;width:18px;height:18px}
.term-win{background:var(--code-bg);color:var(--code-text);border-radius:10px;padding:12px;font-family:Consolas,monospace;font-size:.85rem;height:210px;overflow:auto}
.term-win .p{color:#7ee0a8}.term-win .e{color:#ff8b95}.term-win .d{color:#8f97b8}
.term-in{display:flex;gap:6px;margin-top:8px}
.tree{font-family:Consolas,monospace;font-size:.88rem;line-height:1.9}
.tree .f{cursor:pointer;padding:1px 6px;border-radius:6px}
.tree .f:hover,.tree .f.sel{background:var(--accent-soft);color:var(--accent)}
.commit{display:flex;align-items:center;gap:10px;padding:6px 10px;border:1px solid var(--border);border-radius:9px;margin:5px 0;background:var(--bg)}
.commit.head{border-color:var(--accent);background:var(--accent-soft)}
.commit code{color:var(--muted);font-size:.8rem}
.flow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:10px 0}
.node{flex:1 1 150px;text-align:center;border:2px solid var(--border);border-radius:12px;padding:12px;transition:.25s;background:var(--bg)}
.node.on{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-3px)}
.arrow{color:var(--muted);font-size:1.4rem}
.flip{perspective:700px;height:112px;cursor:pointer}
.flip>div{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on>div{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:.9rem}
.flip .front{background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:1.05rem}
.flip .back{background:var(--surface);transform:rotateY(180deg)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.opt{display:block;width:100%;text-align:left;margin:5px 0}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

html{scroll-behavior:auto}
body.lab{background:var(--surface)}
body.lab main{max-width:none;margin:0;padding:0}
body.lab section.card{border:0;border-radius:0;background:transparent;padding:4px 2px 12px;margin:0}
body.lab section.card>.tag,body.lab section.card>h2,body.lab section.card>.terms{display:none}
</style>
</head>
<body class="lab">
<main>
<section class="card" id="s9">
  <span class="tag">개발 용어</span>
  <h2>9. MVP (최소 기능 제품)</h2>
  <p class="lead">“할 일 앱”을 만든다고 합시다. <b>꼭 필요한 기능</b>만 눌러 선택해 첫 버전(MVP)을 정하세요.</p>
  <div class="terms"><span>MVP</span><span>기능 우선순위</span></div>
  <div class="row" id="mvpList"></div>
  <p id="mvpMsg" class="hint" style="margin-top:12px"></p>
  <div class="grid2"><div class="box good"><h3>1차 버전 (MVP)</h3><div id="mvpIn" class="hint">-</div></div><div class="box"><h3>나중에 추가</h3><div id="mvpOut" class="hint">-</div></div></div>
</section>
</main>

<script>

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));




(function(){
  var LAB_ID = "101-09";
  function setTheme(v){
    document.documentElement.setAttribute('data-theme', v);
    try{ window.dispatchEvent(new Event('themechange')); }catch(e){}
    try{ if (typeof redraws !== 'undefined') redraws.forEach(function(f){ f(); }); }catch(e){}
  }
  // 실습 안의 toast() 는 iframe 아래쪽에 갇히지 않도록 앱 셸 화면에 띄운다
  try{ if (typeof toast === 'function') { toast = function(msg){ parent.postMessage({ type: 'toast', id: LAB_ID, message: String(msg) }, '*'); }; } }catch(e){}
  var m = /theme=(light|dark)/.exec(location.hash); if(m) document.documentElement.setAttribute('data-theme', m[1]);
  window.addEventListener('message', function(e){ if(e.data && e.data.type === 'theme') setTheme(e.data.value); });
  function report(){ try{ parent.postMessage({ type: 'lab-height', id: LAB_ID, height: Math.ceil(document.body.getBoundingClientRect().height) }, '*'); }catch(e){} }
  // 충분히 조작해 봤다는 신호(클릭·입력 6회) → 앱 셸이 실습 완료로 자동 기록
  var engaged = 0, sent = false;
  ['click','input','change'].forEach(function(t){ document.addEventListener(t, function(){
    engaged++; if(!sent && engaged >= 6){ sent = true; try{ parent.postMessage({ type: 'lab-engaged', id: LAB_ID }, '*'); }catch(e){} }
  }, true); });
  if(window.ResizeObserver) new ResizeObserver(report).observe(document.body);
  window.addEventListener('load', report);
  window.addEventListener('error', function(ev){ try{ parent.postMessage({ type: 'lab-error', id: LAB_ID, message: String(ev.message) }, '*'); }catch(e){} });
})();

(function(){
  const F = [['할 일 추가',1],['할 일 완료 체크',1],['할 일 삭제',1],['다크 모드',0],['친구와 공유',0],['알림 보내기',0],['카테고리 분류',0],['로그인·회원가입',0]];
  const sel = new Set();
  $('#mvpList').innerHTML = F.map((f,i) => '<button class="sm" data-i="'+i+'">'+f[0]+'</button>').join('');
  function upd(){
    $$('#mvpList button').forEach(b => b.classList.toggle('primary', sel.has(+b.dataset.i)));
    $('#mvpIn').textContent = [...sel].map(i => F[i][0]).join(', ') || '-';
    $('#mvpOut').textContent = F.map((f,i) => f[0]).filter((_,i) => !sel.has(i)).join(', ') || '-';
    const core = F.map((f,i) => f[1] ? i : -1).filter(i => i >= 0);
    const missing = core.filter(i => !sel.has(i)), extra = [...sel].filter(i => !F[i][1]);
    $('#mvpMsg').innerHTML = !sel.size ? '기능을 선택하세요.' : missing.length ? '<span class="pill warn">부족</span> 핵심 기능이 빠졌어요: ' + missing.map(i => F[i][0]).join(', ') : extra.length ? '<span class="pill warn">과욕</span> 핵심은 갖췄어요! 하지만 ' + extra.map(i => F[i][0]).join(', ') + '은(는) 2차 버전에서 해도 충분합니다.' : '<span class="pill ok">좋은 MVP</span> 작게 시작해서 빨리 확인해 보세요!';
  }
  $$('#mvpList button').forEach(b => b.onclick = () => { const i = +b.dataset.i; sel.has(i) ? sel.delete(i) : sel.add(i); upd(); }); upd();
})();


</script>
</body>
</html>
