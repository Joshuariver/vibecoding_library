<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPEC 방식: 범위 · 정책 · 예시 · 합격기준</title>
<style>
@font-face{font-family:"Pretendard";src:url("../fonts/PretendardVariable.woff2") format("woff2-variations"),url("../fonts/PretendardVariable.woff2") format("woff2");font-weight:45 920;font-style:normal;font-display:swap}
:root{
  --bg:#f6f7fa; --surface:#fff; --text:#1c2130; --muted:#5d6479; --border:#dde1ec;
  --accent:#b4531a; --accent-text:#fff; --accent-soft:#fbeadd;
  --ok:#0d7c55; --ok-soft:#e1f6ed; --bad:#c62f3d; --bad-soft:#fde8ea; --warn:#8f5f00; --warn-soft:#fff1cc;
  --code-bg:#161a28; --code-text:#e8ebf6; --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10131c; --surface:#191e2c; --text:#e9ecf6; --muted:#9ba3bd; --border:#2b3249;
    --accent:#f0a06b; --accent-text:#2a1204; --accent-soft:#3a2517;
    --ok:#4fd1a1; --ok-soft:#15332a; --bad:#ff7a86; --bad-soft:#3a1c22; --warn:#f2c14e; --warn-soft:#3a3016; --code-bg:#0b0e18;
  }
}
:root[data-theme="dark"]{
  --bg:#10131c; --surface:#191e2c; --text:#e9ecf6; --muted:#9ba3bd; --border:#2b3249;
  --accent:#f0a06b; --accent-text:#2a1204; --accent-soft:#3a2517;
  --ok:#4fd1a1; --ok-soft:#15332a; --bad:#ff7a86; --bad-soft:#3a1c22; --warn:#f2c14e; --warn-soft:#3a3016; --code-bg:#0b0e18;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 "Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header.top h1{font-size:1.05rem;margin:0;flex:1 1 auto}
header.top h1 small{color:var(--muted);font-weight:400;margin-left:6px}
nav.toc{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
nav.toc a{white-space:nowrap;text-decoration:none;color:var(--muted);font-size:.85rem;padding:4px 10px;border-radius:99px;border:1px solid var(--border)}
nav.toc a:hover{color:var(--accent);border-color:var(--accent)}
main{max-width:1000px;margin:0 auto;padding:20px 16px 80px}
section.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin:0 0 22px;scroll-margin-top:110px}
section.card h2{margin:0 0 4px;font-size:1.25rem}
.tag{display:inline-block;font-size:.72rem;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 9px;border-radius:99px;margin-bottom:6px}
.lead{color:var(--muted);margin:0 0 14px}
.terms{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.terms span{font-size:.8rem;background:var(--accent-soft);color:var(--accent);padding:2px 9px;border-radius:6px}
button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:7px 14px;border-radius:9px;transition:transform .12s,border-color .15s}
button:hover{border-color:var(--accent)}
button:active{transform:scale(.97)}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
button.danger{border-color:var(--bad);color:var(--bad)}
button.sm{padding:3px 10px;font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.box{border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--bg)}
.box h3{margin:0 0 6px;font-size:.95rem}
.good{border-color:var(--ok);background:var(--ok-soft)}
.badbox{border-color:var(--bad);background:var(--bad-soft)}
pre,code,textarea.code{font-family:"Cascadia Code","D2Coding",Consolas,monospace}
pre.code{background:var(--code-bg);color:var(--code-text);padding:12px;border-radius:10px;overflow:auto;margin:0;font-size:.84rem;line-height:1.55;white-space:pre-wrap;word-break:break-word}
input[type=text],input[type=number],input[type=datetime-local],select,textarea.plain{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text)}
textarea.plain{resize:vertical}
.hint{font-size:.86rem;color:var(--muted)}
.note{border-left:4px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 8px 8px 0;font-size:.92rem;margin-top:12px}
.bar{height:12px;border-radius:99px;background:var(--border);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.78rem;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-radius:0;border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-text);font-weight:600}
label.f{display:block;margin:6px 0;font-size:.92rem}
label.f>b{display:block;font-size:.82rem;color:var(--muted);font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th,.tbl td{border-bottom:1px solid var(--border);padding:6px 8px;text-align:left}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.chat{border:1px solid var(--border);border-radius:10px;padding:10px;background:var(--bg);min-height:100px}
.tcall{font-family:Consolas,monospace;font-size:.82rem;border-left:3px solid var(--accent);padding:3px 8px;margin:4px 0;background:var(--surface)}
.logline{font-family:Consolas,monospace;font-size:.8rem;padding:3px 0;border-bottom:1px dashed var(--border)}
.stepcard{display:flex;gap:10px;align-items:center;border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin:6px 0;background:var(--bg)}
.stepcard .n{flex:1}
.lv{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;border:0;cursor:pointer}
.lv.auto{background:var(--ok-soft);color:var(--ok)}.lv.draft{background:var(--warn-soft);color:var(--warn)}.lv.human{background:var(--bad-soft);color:var(--bad)}
.mark{background:var(--bad-soft);color:var(--bad);border-radius:4px;padding:0 3px;font-weight:700}
.mark.ok{background:var(--ok-soft);color:var(--ok)}
.pipe{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pipe .st{flex:1 1 130px;border:2px solid var(--border);border-radius:10px;padding:8px;text-align:center;font-size:.85rem;background:var(--bg);transition:.25s}
.pipe .st.run{border-color:var(--accent);background:var(--accent-soft)}
.pipe .st.done{border-color:var(--ok);background:var(--ok-soft)}
.pipe .st.wait{border-color:var(--warn);background:var(--warn-soft)}
.flip{perspective:700px;height:116px;cursor:pointer}
.flip>div{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on>div{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:.88rem}
.flip .front{background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:1.02rem}
.flip .back{background:var(--surface);transform:rotateY(180deg)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.opt{display:block;width:100%;text-align:left;margin:5px 0}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.country{border:1px solid var(--border);border-radius:10px;padding:10px;background:var(--bg)}
.country h3{margin:0 0 4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

html{scroll-behavior:auto}
body.lab{background:var(--surface)}
body.lab main{max-width:none;margin:0;padding:0}
body.lab section.card{border:0;border-radius:0;background:transparent;padding:4px 2px 12px;margin:0}
body.lab section.card>.tag,body.lab section.card>h2,body.lab section.card>.terms{display:none}
</style>
</head>
<body class="lab">
<main>
<section class="card" id="s1">
  <span class="tag">고급 프롬프트</span><h2>1. SPEC 방식: 범위 · 정책 · 예시 · 합격기준</h2>
  <p class="lead">큰 시스템은 한 줄 요청으로 만들 수 없습니다. 4가지를 채워 <b>명세(Spec)</b>를 완성해 보세요. 항목이 비면 AI는 추측하게 됩니다.</p>
  <div class="terms"><span>SPEC</span><span>Scope</span><span>Policy / 가드레일</span><span>Examples</span><span>Criteria</span></div>
  <div class="grid2">
    <div>
      <label class="f"><b>S – Scope (무엇을 자동화? 사람은?)</b><textarea class="plain" id="spS" rows="2">RFQ 메일을 구조화하고 견적 초안을 만든다. 가격 예외 판단과 발송은 담당자가 한다.</textarea></label>
      <label class="f"><b>P – Policy (금지·승인 필요·데이터 규칙)</b><textarea class="plain" id="spP" rows="2">고객 발송과 CRM 쓰기는 승인 전 금지. 숫자는 코드로 계산. product_facts.md 밖의 내용 작성 금지.</textarea></label>
      <label class="f"><b>E – Examples (입력→기대 출력 예시 개수)</b><input type="number" id="spE" min="0" max="20" value="3"></label>
      <label class="f"><b>C – Criteria (측정 가능한 합격 기준)</b><textarea class="plain" id="spC" rows="2">평가셋 10건에서 필드 정확도 95% 이상, 금액 필드 오류 0건.</textarea></label>
    </div>
    <div>
      <p class="hint" style="margin:0 0 4px">명세 완성도</p><div class="bar"><i id="spBar"></i></div>
      <div id="spRes" style="margin:10px 0"></div>
      <pre class="code" id="spOut"></pre>
    </div>
  </div>
</section>
</main>

<script>

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const money = n => n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});






(function(){
  var LAB_ID = "103s-01";
  function setTheme(v){
    document.documentElement.setAttribute('data-theme', v);
    try{ window.dispatchEvent(new Event('themechange')); }catch(e){}
    try{ if (typeof redraws !== 'undefined') redraws.forEach(function(f){ f(); }); }catch(e){}
  }
  // 실습 안의 toast() 는 iframe 아래쪽에 갇히지 않도록 앱 셸 화면에 띄운다
  try{ if (typeof toast === 'function') { toast = function(msg){ parent.postMessage({ type: 'toast', id: LAB_ID, message: String(msg) }, '*'); }; } }catch(e){}
  var m = /theme=(light|dark)/.exec(location.hash); if(m) document.documentElement.setAttribute('data-theme', m[1]);
  window.addEventListener('message', function(e){ if(e.data && e.data.type === 'theme') setTheme(e.data.value); });
  function report(){ try{ parent.postMessage({ type: 'lab-height', id: LAB_ID, height: Math.ceil(document.body.getBoundingClientRect().height) }, '*'); }catch(e){} }
  // 충분히 조작해 봤다는 신호(클릭·입력 6회) → 앱 셸이 실습 완료로 자동 기록
  var engaged = 0, sent = false;
  ['click','input','change'].forEach(function(t){ document.addEventListener(t, function(){
    engaged++; if(!sent && engaged >= 6){ sent = true; try{ parent.postMessage({ type: 'lab-engaged', id: LAB_ID }, '*'); }catch(e){} }
  }, true); });
  if(window.ResizeObserver) new ResizeObserver(report).observe(document.body);
  window.addEventListener('load', report);
  window.addEventListener('error', function(ev){ try{ parent.postMessage({ type: 'lab-error', id: LAB_ID, message: String(ev.message) }, '*'); }catch(e){} });
})();

(function(){
  function upd(){
    const S = $('#spS').value.trim(), P = $('#spP').value.trim(), E = +$('#spE').value || 0, C = $('#spC').value.trim();
    const hasNum = /\d/.test(C), hasGuard = /(금지|승인|코드)/.test(P);
    const checks = [
      [S.length > 15, 'Scope: 자동화 범위와 사람 담당을 구분해 적었나'],
      [P.length > 15 && hasGuard, 'Policy: 금지/승인/데이터 규칙이 들어갔나'],
      [E >= 3, 'Examples: 예시 3개 이상'],
      [C.length > 8 && hasNum, 'Criteria: 숫자로 측정 가능한 기준인가']
    ];
    const ok = checks.filter(c => c[0]).length;
    $('#spBar').style.width = ok / 4 * 100 + '%';
    $('#spRes').innerHTML = checks.map(c => '<div>' + (c[0] ? '<span class="pill ok">OK</span>' : '<span class="pill bad">보완</span>') + ' ' + c[1] + '</div>').join('');
    $('#spOut').textContent = '# SPEC.md\n\n## Scope\n' + S + '\n\n## Policy\n' + P + '\n\n## Examples\n- 입력→기대 출력 예시 ' + E + '건 (eval/ 폴더)\n\n## Criteria\n' + C;
  }
  ['#spS','#spP','#spE','#spC'].forEach(s => $(s).oninput = upd); upd();
})();


</script>
</body>
</html>
