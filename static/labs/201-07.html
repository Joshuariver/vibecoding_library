<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마이크로 인터랙션 · 토스트</title>
<style>
@font-face{font-family:"Pretendard";src:url("../fonts/PretendardVariable.woff2") format("woff2-variations"),url("../fonts/PretendardVariable.woff2") format("woff2");font-weight:45 920;font-style:normal;font-display:swap}
:root{
  --bg:#f5f7fb; --surface:#fff; --text:#1b2033; --muted:#5f6680; --border:#dde1ee;
  --accent:#0f7b6c; --accent-text:#fff; --accent-soft:#dff4ef;
  --ok:#0d7c55; --ok-soft:#e1f6ed; --bad:#c62f3d; --bad-soft:#fde8ea; --warn:#8f5f00; --warn-soft:#fff1cc;
  --code-bg:#12182a; --code-text:#e6e9f5; --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1320; --surface:#171d2f; --text:#e8ecf7; --muted:#9aa4c0; --border:#2a3350;
    --accent:#4fd1b8; --accent-text:#08201b; --accent-soft:#17352f;
    --ok:#4fd1a1; --ok-soft:#15332a; --bad:#ff7a86; --bad-soft:#3a1c22; --warn:#f2c14e; --warn-soft:#3a3016; --code-bg:#0a0e19;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1320; --surface:#171d2f; --text:#e8ecf7; --muted:#9aa4c0; --border:#2a3350;
  --accent:#4fd1b8; --accent-text:#08201b; --accent-soft:#17352f;
  --ok:#4fd1a1; --ok-soft:#15332a; --bad:#ff7a86; --bad-soft:#3a1c22; --warn:#f2c14e; --warn-soft:#3a3016; --code-bg:#0a0e19;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 "Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header.top h1{font-size:1.05rem;margin:0;flex:1 1 auto}
header.top h1 small{color:var(--muted);font-weight:400;margin-left:6px}
nav.toc{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
nav.toc a{white-space:nowrap;text-decoration:none;color:var(--muted);font-size:.85rem;padding:4px 10px;border-radius:99px;border:1px solid var(--border)}
nav.toc a:hover{color:var(--accent);border-color:var(--accent)}
nav.toc .sep{color:var(--muted);align-self:center;font-size:.8rem;padding:0 4px}
main{max-width:1000px;margin:0 auto;padding:20px 16px 80px}
section.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin:0 0 22px;scroll-margin-top:110px}
section.card h2{margin:0 0 4px;font-size:1.25rem}
.part{font-size:1.05rem;margin:34px 0 12px;color:var(--accent);border-bottom:2px solid var(--accent);padding-bottom:4px}
.tag{display:inline-block;font-size:.72rem;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 9px;border-radius:99px;margin-bottom:6px}
.lead{color:var(--muted);margin:0 0 14px}
.terms{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.terms span{font-size:.8rem;background:var(--accent-soft);color:var(--accent);padding:2px 9px;border-radius:6px}
button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:7px 14px;border-radius:9px;transition:transform .12s,background .15s,border-color .15s}
button:hover{border-color:var(--accent)}
button:active{transform:scale(.97)}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
button.danger{border-color:var(--bad);color:var(--bad)}
button.sm{padding:3px 10px;font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.box{border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--bg)}
.box h3{margin:0 0 6px;font-size:.95rem}
.good{border-color:var(--ok);background:var(--ok-soft)}
.badbox{border-color:var(--bad);background:var(--bad-soft)}
pre,code,textarea.code{font-family:"Cascadia Code","D2Coding",Consolas,monospace}
pre.code{background:var(--code-bg);color:var(--code-text);padding:12px;border-radius:10px;overflow:auto;margin:0;font-size:.84rem;line-height:1.55;white-space:pre-wrap;word-break:break-word}
input[type=text],input[type=number],select,textarea.plain{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text)}
.hint{font-size:.86rem;color:var(--muted)}
.note{border-left:4px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 8px 8px 0;font-size:.92rem;margin-top:12px}
.bar{height:12px;border-radius:99px;background:var(--border);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.78rem;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-text);font-weight:600}
.sw{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label.f{display:block;margin:6px 0;font-size:.92rem}
label.f b{display:inline-block;min-width:3.2em}

/* demo scope: component tokens (section A,B,F) */
.demo{--d-primary:#2563eb;--d-radius:10px;--d-space:16px;--d-fs:16px;--d-bg:#ffffff;--d-surface:#f4f6fb;--d-text:#1b2033;--d-muted:#5f6680;--d-border:#d7dcea;
  background:var(--d-bg);color:var(--d-text);border:1px solid var(--d-border);border-radius:12px;padding:var(--d-space);font-size:var(--d-fs);transition:background .25s,color .25s}
.demo.dark{--d-bg:#10131c;--d-surface:#1a1f2e;--d-text:#eef0f8;--d-muted:#a5adc8;--d-border:#2d3450}
.d-btn{background:var(--d-primary);color:#fff;border:0;border-radius:var(--d-radius);padding:calc(var(--d-space)/2) var(--d-space);font-size:var(--d-fs);cursor:pointer;font-weight:600}
.d-btn.ghost{background:transparent;color:var(--d-primary);border:2px solid var(--d-primary)}
.d-card{background:var(--d-surface);border:1px solid var(--d-border);border-radius:var(--d-radius);padding:var(--d-space)}
.d-card h4{margin:0 0 4px}
.d-card p{margin:0 0 var(--d-space);color:var(--d-muted)}
.d-badge{display:inline-block;background:var(--d-primary);color:#fff;border-radius:99px;padding:1px 10px;font-size:.75em;margin-bottom:6px}

/* responsive demo */
.vp-wrap{background:repeating-conic-gradient(var(--border) 0 25%,transparent 0 50%) 0 0/16px 16px;border-radius:10px;padding:10px;overflow:auto}
.vp{margin:0 auto;background:#fff;color:#1b2033;border:2px solid var(--accent);border-radius:8px;overflow:hidden;transition:width .12s;max-width:100%}
.vp nav{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#1b2033;color:#fff}
.vp .menu{display:flex;gap:12px}.vp .burger{display:none;font-size:1.3rem}
.vp .g{display:grid;gap:10px;padding:12px}
.vp .g div{background:#e8edf9;border-radius:8px;padding:18px 8px;text-align:center;font-size:.9rem}
.vp.mobile .menu{display:none}.vp.mobile .burger{display:block}

/* hierarchy demo */
.hier-bad,.hier-good{background:#fff;color:#222;border:1px solid #ddd;border-radius:10px;padding:16px}
.hier-bad *{font-size:14px;font-weight:400;margin:2px 0;color:#444}
.hier-bad button{border:1px solid #bbb;background:#f1f1f1;padding:4px 8px;margin-right:6px}
.hier-good h4{font-size:1.4rem;margin:0 0 2px;color:#111}
.hier-good .price{font-size:1.8rem;font-weight:800;color:#0f7b6c;margin:6px 0}
.hier-good .sub{color:#666;font-size:.85rem;margin:0 0 12px}
.hier-good .cta{background:#0f7b6c;color:#fff;border:0;border-radius:10px;padding:10px 22px;font-weight:700;cursor:pointer}
.hier-good .sec{background:none;border:0;color:#666;text-decoration:underline;cursor:pointer;margin-left:8px}

/* contrast */
.cprev{padding:18px;border-radius:10px;border:1px solid var(--border);text-align:center;font-size:1.1rem}

/* micro */
.mi-btn{position:relative;background:var(--accent);color:var(--accent-text);border:0;padding:10px 22px;border-radius:10px;font-weight:700;transition:transform .2s,box-shadow .2s,filter .2s}
.mi-btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.2);filter:brightness(1.08)}
.mi-btn:active{transform:translateY(0) scale(.97)}
.mi-card{border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:transform .25s,box-shadow .25s;background:var(--bg)}
.mi-card:hover{transform:scale(1.04);box-shadow:0 10px 24px rgba(0,0,0,.18)}
#toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:var(--code-bg);color:#fff;padding:10px 16px;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.3);animation:tin .25s ease}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.noanim *{transition:none!important;animation:none!important}

/* states */
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--border) 25%,var(--bg) 50%,var(--border) 75%);background-size:200% 100%;animation:sh 1.2s infinite;margin:8px 0}
@keyframes sh{to{background-position:-200% 0}}
.state-box{min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:14px}

/* stepper */
.steps{display:flex;gap:6px;margin-bottom:12px}
.steps i{flex:1;height:6px;border-radius:99px;background:var(--border)}
.steps i.on{background:var(--accent)}
.flowmap{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.flowmap span.n{padding:4px 10px;border-radius:8px;border:1px solid var(--border);font-size:.85rem;background:var(--bg)}
.flowmap span.n.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}

/* a11y */
.a11y-bad{background:#ddd;color:#bbb;border:0;padding:8px 14px;outline:none}
.a11y-good{background:#0b5cad;color:#fff;border:0;padding:8px 14px;border-radius:8px}
.a11y-good:focus-visible{outline:3px solid #f5a623;outline-offset:2px}

/* API */
.http{font-family:Consolas,monospace;font-size:.85rem}
.m{display:inline-block;min-width:62px;text-align:center;border-radius:6px;font-weight:700;padding:1px 6px;color:#fff;font-size:.8rem}
.m.GET{background:#2563eb}.m.POST{background:#0d7c55}.m.PUT{background:#b9770e}.m.PATCH{background:#8e44ad}.m.DELETE{background:#c62f3d}
.sc{font-weight:800}.sc.s2{color:var(--ok)}.sc.s4{color:var(--warn)}.sc.s5{color:var(--bad)}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th,.tbl td{border-bottom:1px solid var(--border);padding:6px 8px;text-align:left}
.logline{font-family:Consolas,monospace;font-size:.8rem;padding:3px 0;border-bottom:1px dashed var(--border)}

/* MCP */
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.srv{border:2px dashed var(--border);border-radius:12px;padding:10px;text-align:center;cursor:pointer;background:var(--bg);transition:.2s}
.srv.on{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.srv .perm{font-size:.75rem}
.chat{border:1px solid var(--border);border-radius:10px;padding:10px;background:var(--bg);min-height:120px}
.chat .u{color:var(--accent);font-weight:700}
.tcall{font-family:Consolas,monospace;font-size:.82rem;border-left:3px solid var(--accent);padding:3px 8px;margin:4px 0;background:var(--surface)}

.flip{perspective:700px;height:116px;cursor:pointer}
.flip>div{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on>div{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:.88rem}
.flip .front{background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:1.02rem}
.flip .back{background:var(--surface);transform:rotateY(180deg)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.opt{display:block;width:100%;text-align:left;margin:5px 0}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

html{scroll-behavior:auto}
body.lab{background:var(--surface)}
body.lab main{max-width:none;margin:0;padding:0}
body.lab section.card{border:0;border-radius:0;background:transparent;padding:4px 2px 12px;margin:0}
body.lab section.card>.tag,body.lab section.card>h2,body.lab section.card>.terms{display:none}
</style>
</head>
<body class="lab">
<main>
<section class="card" id="a7">
  <span class="tag">UX</span><h2>7. 마이크로 인터랙션 · 토스트</h2>
  <p class="lead">버튼 호버, 클릭 반응, 알림 같은 <b>작은 반응</b>이 “살아있는 느낌”을 줍니다. 다만 과하면 방해가 됩니다.</p>
  <div class="terms"><span>마이크로 인터랙션</span><span>호버</span><span>토스트</span><span>동작 줄이기</span></div>
  <div class="row" style="margin-bottom:12px">
    <button class="mi-btn" id="miSave">💾 저장하기</button>
    <label><input type="checkbox" id="miReduce"> 동작 줄이기 (접근성 설정)</label>
  </div>
  <div class="grid2" id="miArea"><div class="mi-card" tabindex="0"><b>카드 A</b><br><span class="hint">마우스를 올려 보세요</span></div><div class="mi-card" tabindex="0"><b>카드 B</b><br><span class="hint">키보드 포커스도 OK</span></div></div>
</section>
</main>
<div id="toasts" aria-live="polite"></div>
<script>

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; $('#toasts').appendChild(t); setTimeout(() => t.remove(), 3000); }




(function(){
  var LAB_ID = "201-07";
  function setTheme(v){
    document.documentElement.setAttribute('data-theme', v);
    try{ window.dispatchEvent(new Event('themechange')); }catch(e){}
    try{ if (typeof redraws !== 'undefined') redraws.forEach(function(f){ f(); }); }catch(e){}
  }
  // 실습 안의 toast() 는 iframe 아래쪽에 갇히지 않도록 앱 셸 화면에 띄운다
  try{ if (typeof toast === 'function') { toast = function(msg){ parent.postMessage({ type: 'toast', id: LAB_ID, message: String(msg) }, '*'); }; } }catch(e){}
  var m = /theme=(light|dark)/.exec(location.hash); if(m) document.documentElement.setAttribute('data-theme', m[1]);
  window.addEventListener('message', function(e){ if(e.data && e.data.type === 'theme') setTheme(e.data.value); });
  function report(){ try{ parent.postMessage({ type: 'lab-height', id: LAB_ID, height: Math.ceil(document.body.getBoundingClientRect().height) }, '*'); }catch(e){} }
  // 충분히 조작해 봤다는 신호(클릭·입력 6회) → 앱 셸이 실습 완료로 자동 기록
  var engaged = 0, sent = false;
  ['click','input','change'].forEach(function(t){ document.addEventListener(t, function(){
    engaged++; if(!sent && engaged >= 6){ sent = true; try{ parent.postMessage({ type: 'lab-engaged', id: LAB_ID }, '*'); }catch(e){} }
  }, true); });
  if(window.ResizeObserver) new ResizeObserver(report).observe(document.body);
  window.addEventListener('load', report);
  window.addEventListener('error', function(ev){ try{ parent.postMessage({ type: 'lab-error', id: LAB_ID, message: String(ev.message) }, '*'); }catch(e){} });
})();

(function(){
  $('#miSave').onclick = () => toast('💾 저장되었습니다');
  $('#miReduce').onchange = e => document.body.classList.toggle('noanim', e.target.checked);
})();


</script>
</body>
</html>
